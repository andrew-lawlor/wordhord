[package]
name = "wordhord-typeset"
description = "Typesets a Wordhord book into pages of glyph runs, with a PNG preview"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wordhord-book = { path = "../wordhord-book" }
rustybuzz = "0.20"
swash = "0.2"
hyphenation = { version = "0.8", features = ["embed_en-us"] }
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
# SVG, as title pages and publishers' marks often are: paths only, no text
# or fonts of its own.
resvg = { version = "0.48", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
