[package]
name = "wordhord-device"
description = "The Wordhord reader on a Kobo: draws compiled pages with FBInk"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wordhord-reader"
path = "src/main.rs"

[dependencies]
wordhord-typeset = { path = "../wordhord-typeset" }
wordhord-epub = { path = "../wordhord-epub" }
wordhord-dict = { path = "../wordhord-dict" }
wordhord-book = { path = "../wordhord-book" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
libc = "0.2"

[build-dependencies]
cc = "1"

[target.'cfg(not(target_arch = "arm"))'.dependencies]
minifb = { version = "0.28", default-features = false, features = ["x11"] }

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
