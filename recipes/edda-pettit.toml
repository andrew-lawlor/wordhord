# Edward Pettit, The Poetic Edda: A Dual-Language Edition (Open Book
# Publishers, 2023), doi:10.11647/OBP.0308. CC BY-NC 4.0.
# Pettit's English translation: each chapter's English section, from its
# heading to the textual apparatus, with his footnotes. Numbered as his
# Old Norse text (edda-pettit-non), which it translates line for line.
# Imported from the publisher's TEI XML with the import-xml example.

styling = []
starts = "head[type=section-lev1]"

[book]
id = "edda-pettit"
title = "The Poetic Edda"
translator = "Edward Pettit"
year = 2023
lang = "eng"
license = "CC BY-NC 4.0"
original = "edda-pettit-non"
source = "Edward Pettit, The Poetic Edda: A Dual-Language Edition, Open Book Publishers, 2023, doi:10.11647/OBP.0308"

