[[role]]
select = "anchor"
as = "drop"

# Pettit's footnotes: his commentary, kept as footnotes.
[[role]]
select = "note"
as = "note"

[[role]]
select = "head[type=section-lev2]"
as = "heading"
level = 2

[[role]]
select = "head"
as = "heading"
level = 1

# Prose passages between stanzas.
[[role]]
select = "quote"
as = "paragraph"

# A line with a stanza number directly in it opens a stanza; notes in a
# line have <ref> links of their own.
[[role]]
select = "l"
as = "line"
number = "l > ref"

[[role]]
select = "hi[rendition=simple:italic]"
as = "emphasis"

# Bold marks manuscript sigla: R (Codex Regius), H (Hauksbók).
[[role]]
select = "hi[rendition=simple:bold]"
as = "strong"

[[role]]
select = "ref"
as = "unwrap"
