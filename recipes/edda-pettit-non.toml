# Edward Pettit, The Poetic Edda: A Dual-Language Edition (Open Book
# Publishers, 2023), doi:10.11647/OBP.0308. CC BY-NC 4.0.
# The Old Norse text only: each chapter's Old Norse section, from its
# heading to the first heading of the English translation. Imported from
# the publisher's TEI XML with the import-xml example.
#
# Abbreviations match the Bellows book; Pettit prints Svipdagsmál as two
# poems (grg, fj), and the Hauksbók Völuspá is vsph.

# Three non-breaking spaces between half-lines.
caesura_pattern = '\x{a0}{2,}'
styling = []

# Chapter titles and synopsis subheadings repeat the poems' names; only
# section headings start and end works.
starts = "head[type=section-lev1]"

[book]
id = "edda-pettit-non"
title = "The Poetic Edda"
lang = "non"
license = "CC BY-NC 4.0"
source = "Edward Pettit, The Poetic Edda: A Dual-Language Edition, Open Book Publishers, 2023, doi:10.11647/OBP.0308"

[book.refs]
unit = "stanza.line"

