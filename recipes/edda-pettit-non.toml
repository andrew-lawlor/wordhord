# Index markers and anchors carry no text; footnotes belong to the
# English translation.
[[role]]
select = "anchor"
as = "drop"

[[role]]
select = "note"
as = "drop"

[[role]]
select = "head[type=section-lev2]"
as = "heading"
level = 2

[[role]]
select = "head"
as = "heading"
level = 1

# Prose passages between stanzas.
[[role]]
select = "quote"
as = "paragraph"

# A line that carries a stanza number (<ref>1</ref>.) opens a stanza.
[[role]]
select = "l"
as = "line"
number = "l > ref"

# Pettit italicises letters he has emended, in the poems and the prose;
# in headings, italics are titles.
[[role]]
select = "head hi[rendition=simple:italic]"
as = "emphasis"

[[role]]
select = "hi[rendition=simple:italic]"
as = "corr"
