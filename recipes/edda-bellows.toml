# The volume headings ("LAYS OF THE HEROES") sit directly in the volume;
# poem titles sit in each poem's own heading block.
[[role]]
select = "div.volume > h2"
as = "drop"

# Page numbers of the print edition, "[3]". Links back to the contents
# share the class: they don't match the pattern, so they're dropped.
[[role]]
select = "span.pageNum"
as = "page"
pattern = '^\[(\d+)\]$'

# Verse quoted in the notes (variant lines from other manuscripts) is part
# of the note, not a stanza of the poem.
[[role]]
select = "div.endNotes div.lgouter"
as = "verse"

[[role]]
select = "div.lgouter"
as = "stanza"
number = "span.verseNum"

[[role]]
select = "p.line"
as = "line"

# Bellows' notes follow each poem, one per stanza: "1. A few editors…"
[[role]]
select = "div.endNotes h3"
as = "drop"

# Notes on prose have no number: their italic label ("Prose.") links to
# the passage.
[[role]]
select = "div.endNotes p"
as = "commentary"
number = "span.parNum"
target = "i"

[[role]]
select = "h2.main"
as = "heading"
level = 1

[[role]]
select = "h2.sub"
as = "heading"
level = 2

# Alvíssmál's subtitle.
[[role]]
select = "h2.label"
as = "heading"
level = 2

# Bellows' marks for lines or stanzas lost from the manuscripts.
[[role]]
select = "p.verseStars"
as = "gap"

# Gutenberg's thematic break: a rule, sometimes drawn as dots.
[[role]]
select = "p.tb"
as = "break"

# "Introductory Note", before the poem.
[[role]]
select = "h3.main"
as = "heading"
level = 2

# Transcriber's corrections: keep the corrected text.
[[role]]
select = "span.corr"
as = "unwrap"
