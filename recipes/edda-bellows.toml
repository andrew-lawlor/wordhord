# Henry Adams Bellows, The Poetic Edda (1923). Project Gutenberg #73533.
# All 35 works, in Bellows' order. Abbreviations follow Neckel–Kuhn, in
# lowercase ASCII; `svip` (Bellows joins Grógaldr and Fjölsvinnsmál) and
# `oddr` are our own.

end = "PRONOUNCING INDEX OF PROPER NAMES"
caesura = true
# Structural wrappers and type styling.
styling = ["div0", "div1", "div2", "divHead", "divBody", "section", "introduction", "introNote", "endNotes", "last-child", "first", "main", "sc", "body", "volume", "back", "appendix", "pginternal"]

