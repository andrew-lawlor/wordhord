# Kobo Libra Colour: 7", 1264×1680 at 300 ppi; Kaleido colour, set here in
# grey.
name = "Libra Colour"
width = 1264
height = 1680
ppi = 300
# Millimetres.
margins = { top = 8, bottom = 9, left = 8, right = 8 }
# Points, and line spacing as a multiple of the size.
body_size = 11.0
leading = 1.35

# Font paths are relative to this file.
[fonts]
regular = "../fonts/junicode/Junicode-Regular.otf"
italic = "../fonts/junicode/Junicode-Italic.otf"
bold = "../fonts/junicode/Junicode-Bold.otf"
bold_italic = "../fonts/junicode/Junicode-BoldItalic.otf"
mono = "../fonts/dejavu/DejaVuSansMono.ttf"
fallback = "../fonts/dejavu/DejaVuSerif.ttf"
fallbacks = [
    "../fonts/noto/NotoSerifHebrew-Regular.ttf",
    "../fonts/noto/NotoNaskhArabic-Regular.ttf",
    "../fonts/noto/NotoSerifDevanagari-Regular.ttf",
]
